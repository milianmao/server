<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080c">
<title>液氷黑胶 · 网易云解灰播放器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b5c'/%3E%3Cstop offset='1' stop-color='%237b2ff7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%2308080c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ inline icon sprite (no external assets) ══ -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-brand" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/>
    <circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".8"/>
    <circle cx="16" cy="16" r="2.8" fill="currentColor"/>
    <path d="M4.5 19.5c3 0 3.6-7 6.6-7s3.6 7 6.6 7 3.6-7 6.6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.4 15.4 21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6.4l10-2v11.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="6.6" cy="18" r="2.9" fill="currentColor"/><circle cx="16.6" cy="15.6" r="2.9" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2a1 1 0 0 1 1.5-.87l9.2 5.3a1 1 0 0 1 0 1.73l-9.2 5.3a1 1 0 0 1-1.5-.86z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.6" y="5.2" width="3.6" height="13.6" rx="1.5" fill="currentColor"/><rect x="13.8" y="5.2" width="3.6" height="13.6" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18.6 5.8a1 1 0 0 1 1.6.84v10.7a1 1 0 0 1-1.6.85l-7.3-5.35a1 1 0 0 1 0-1.7z" fill="currentColor"/><rect x="4" y="5.3" width="2.9" height="13.4" rx="1.4" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.4 5.8a1 1 0 0 0-1.6.84v10.7a1 1 0 0 0 1.6.85l7.3-5.35a1 1 0 0 0 0-1.7z" fill="currentColor"/><rect x="17.1" y="5.3" width="2.9" height="13.4" rx="1.4" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3.5 6.5h3.2c1.3 0 2.5.6 3.3 1.7l1.4 2M3.5 17.5h3.2c1.3 0 2.5-.6 3.3-1.7l4.6-6.6c.8-1.1 2-1.7 3.3-1.7h2.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="m18.4 4.6 2.6 2.9-2.6 2.9M18.4 14.6l2.6 2.9-2.6 2.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 5.6h9.2a3.6 3.6 0 0 1 3.6 3.6v2.4M17 19.4H7.8a3.6 3.6 0 0 1-3.6-3.6v-2.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m5.4 8.4 2-2.8 2 2.8M18.6 16.6l-2 2.8-2-2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 5.6h9.2a3.6 3.6 0 0 1 3.6 3.6v2.4M17 19.4H7.8a3.6 3.6 0 0 1-3.6-3.6v-2.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m5.4 8.4 2-2.8 2 2.8M18.6 16.6l-2 2.8-2-2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.4" text-anchor="middle" font-size="8.4" font-family="inherit" font-weight="700" fill="currentColor">1</text></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4.2 9.4h3l3.6-3.1a.6.6 0 0 1 1 .45v10.5a.6.6 0 0 1-1 .45l-3.6-3.1h-3a.8.8 0 0 1-.8-.8V10.2a.8.8 0 0 1 .8-.8z" fill="currentColor"/><path d="M15 8.6a4.8 4.8 0 0 1 0 6.8M17.8 6.2a8.3 8.3 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4.2 9.4h3l3.6-3.1a.6.6 0 0 1 1 .45v10.5a.6.6 0 0 1-1 .45l-3.6-3.1h-3a.8.8 0 0 1-.8-.8V10.2a.8.8 0 0 1 .8-.8z" fill="currentColor"/><path d="m15.4 9.4 5.2 5.2M20.6 9.4l-5.2 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-lyric" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 9.4h6M7 12.6h10M7 15.8h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17.6 14.6v5.2M17.6 14.6l3-1v5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16.2" cy="19.6" r="1.7" fill="currentColor"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9.6 4.5H4.5v5.1M14.4 4.5h5.1v5.1M14.4 19.5h5.1v-5.1M9.6 19.5H4.5v-5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5.4 7h13.2M9.6 7V5.4a1 1 0 0 1 1-1h2.8a1 1 0 0 1 1 1V7M7.4 7l.8 11.2a1.6 1.6 0 0 0 1.6 1.5h4.4a1.6 1.6 0 0 0 1.6-1.5L16.6 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l2.6-2.6a3.6 3.6 0 0 0-5.1-5.1l-1 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.1 0l-2.6 2.6a3.6 3.6 0 0 0 5.1 5.1l1-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
</svg>

<!-- ══ ambient background ══ -->
<div class="ambient" aria-hidden="true">
  <span class="glow glow--crimson"></span>
  <span class="glow glow--violet"></span>
  <span class="grain"></span>
  <span class="vignette"></span>
</div>

<div class="app" id="app">

  <!-- ── rail ── -->
  <aside class="rail" aria-label="导航">
    <div class="brand">
      <span class="brand__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-brand"/></svg></span>
      <span class="brand__text">
        <b>液氷黑胶</b>
        <i>UNM PLAYER</i>
      </span>
    </div>

    <nav class="nav" aria-label="主导航">
      <button class="nav__item is-active" type="button" data-nav="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg><span>搜索</span>
      </button>
      <button class="nav__item" type="button" data-nav="nowplaying">
        <svg aria-hidden="true"><use href="#i-note"/></svg><span>正在播放</span>
      </button>
    </nav>

    <section class="rail__block">
      <h2 class="rail__title">歌单</h2>
      <form class="playlist-form" id="playlistForm">
        <input class="input input--sm" id="playlistInput" type="text" inputmode="text"
               placeholder="歌单 ID 或链接" aria-label="歌单 ID 或网易云链接" autocomplete="off" spellcheck="false">
        <button class="btn btn--icon btn--accent" type="submit" aria-label="加载歌单">
          <svg aria-hidden="true"><use href="#i-link"/></svg>
        </button>
      </form>
    </section>

    <section class="rail__block rail__block--grow">
      <h2 class="rail__title">最近播放</h2>
      <div class="recent" id="recentList" role="list" aria-label="最近播放"></div>
    </section>

    <p class="rail__foot">本机代理 · 仅供自用</p>
  </aside>

  <!-- ── main ── -->
  <main class="main" aria-label="主内容">
    <div class="searchbar">
      <form class="searchbar__form" id="searchForm" role="search">
        <svg class="searchbar__icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="input" id="searchInput" type="search" placeholder="搜索歌曲、歌手、专辑"
               aria-label="搜索歌曲" autocomplete="off" spellcheck="false">
        <button class="btn btn--accent" type="submit">搜索</button>
      </form>
      <p class="searchbar__hint" id="searchHint">回车搜索</p>
    </div>

    <header class="panel-head">
      <div class="panel-head__text">
        <h1 class="panel-head__title" id="viewTitle">开始听歌</h1>
        <p class="panel-head__sub" id="viewSub">在上方搜索，或粘贴一个歌单链接</p>
      </div>
      <span class="count-badge" id="viewCount" hidden></span>
    </header>

    <div class="list" id="resultList" role="list" aria-label="歌曲列表"></div>
  </main>

  <!-- ── queue ── -->
  <aside class="queue" id="queuePane" aria-label="播放队列">
    <header class="queue__head">
      <h2 class="queue__title">播放队列 <span class="queue__num" id="queueCount">0</span></h2>
      <div class="queue__actions">
        <button class="btn btn--ghost btn--sm" type="button" id="queuePlayAll">播放全部</button>
        <button class="btn btn--ghost btn--sm btn--danger" type="button" id="queueClear">清空</button>
      </div>
    </header>
    <div class="list list--queue" id="queueList" role="list" aria-label="队列歌曲"></div>
    <button class="queue__scrim" type="button" id="queueScrim" aria-label="关闭队列"></button>
  </aside>
</div>

<!-- ── player bar ── -->
<footer class="bar" aria-label="播放控制">
  <div class="bar__progress" id="seek" role="slider" tabindex="0"
       aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">
    <div class="bar__progress-track"><div class="bar__progress-fill" id="seekFill"></div><span class="bar__progress-knob" id="seekKnob"></span></div>
    <span class="bar__tooltip" id="seekTip" hidden>0:00</span>
  </div>

  <div class="bar__inner">
    <div class="now" id="nowBox">
      <span class="now__art" id="nowArt"><span class="now__art-ph"><svg aria-hidden="true"><use href="#i-note"/></svg></span></span>
      <span class="now__meta">
        <b class="now__title" id="nowTitle">未在播放</b>
        <i class="now__sub" id="nowSub">选择一首歌开始</i>
      </span>
      <span class="pill pill--replaced" id="nowReplaced" hidden>已换源</span>
    </div>

    <div class="bar__controls">
      <button class="btn btn--icon" type="button" id="btnMode" aria-label="播放模式：列表循环" data-mode="list">
        <svg aria-hidden="true"><use href="#i-repeat" id="modeUse"/></svg>
      </button>
      <button class="btn btn--icon" type="button" id="btnPrev" aria-label="上一首"><svg aria-hidden="true"><use href="#i-prev"/></svg></button>
      <button class="btn btn--icon btn--play" type="button" id="btnPlay" aria-label="播放"><svg aria-hidden="true"><use href="#i-play" id="playUse"/></svg></button>
      <button class="btn btn--icon" type="button" id="btnNext" aria-label="下一首"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      <button class="btn btn--icon" type="button" id="btnShuffle" aria-label="随机播放"><svg aria-hidden="true"><use href="#i-shuffle"/></svg></button>
    </div>

    <div class="bar__right">
      <span class="time time--cur" id="timeCur">0:00</span>
      <span class="time time--sep">/</span>
      <span class="time time--tot" id="timeTot">0:00</span>
      <div class="bar__vol">
        <button class="btn btn--icon btn--sm" type="button" id="btnMute" aria-label="静音"><svg aria-hidden="true"><use href="#i-volume" id="volUse"/></svg></button>
        <div class="vol" id="vol" role="slider" tabindex="0" aria-label="音量"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="100%">
          <div class="vol__track"><div class="vol__fill" id="volFill"></div></div>
        </div>
      </div>
      <button class="btn btn--icon" type="button" id="btnLyric" aria-label="歌词"><svg aria-hidden="true"><use href="#i-lyric"/></svg></button>
      <button class="btn btn--icon" type="button" id="btnQueue" aria-label="队列" aria-expanded="true"><svg aria-hidden="true"><use href="#i-queue"/></svg></button>
      <button class="btn btn--icon" type="button" id="btnExpand" aria-label="全屏播放"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
    </div>
  </div>
</footer>

<!-- ── immersive ── -->
<section class="immersive" id="immersive" hidden aria-label="沉浸播放" role="dialog" aria-modal="true">
  <div class="immersive__bg" id="immersiveBg" aria-hidden="true"></div>
  <div class="immersive__scrim" aria-hidden="true"></div>
  <header class="immersive__top">
    <button class="btn btn--icon" type="button" id="btnImmersiveClose" aria-label="退出全屏"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    <span class="immersive__src" id="immersiveSrc"></span>
  </header>
  <div class="immersive__body">
    <div class="immersive__left">
      <div class="disc" id="disc">
        <span class="disc__ring" aria-hidden="true"></span>
        <span class="disc__art" id="discArt"><span class="disc__ph"><svg aria-hidden="true"><use href="#i-note"/></svg></span></span>
      </div>
      <div class="immersive__meta">
        <h2 class="immersive__title" id="immersiveTitle">未在播放</h2>
        <p class="immersive__artist" id="immersiveArtist">—</p>
        <p class="immersive__album" id="immersiveAlbum">—</p>
        <span class="pill pill--replaced" id="immersiveReplaced" hidden>已换源</span>
      </div>
    </div>
    <div class="immersive__right">
      <div class="lyrics" id="lyrics" aria-label="歌词" aria-live="polite"></div>
    </div>
  </div>
</section>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<audio id="audio" preload="metadata"></audio>

<script type="module" src="app.js"></script>
</body>
</html>
